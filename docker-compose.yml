x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipelinemedic:pipelinemedic@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__SECRET_KEY: "pipelinemedic-demo-secret-key"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # The DAG (airflow/dags/order_data_quality_dag.py) and
    # scripts/inject_airflow_failure.py both read PIPELINEMEDIC_DB_DSN
    # (a libpq DSN string, not a SQLAlchemy URL) to connect to the
    # pipelinemedic app database (a different DB than Airflow's own
    # metadata DB above) via psycopg2.
    PIPELINEMEDIC_DB_DSN: "dbname=pipelinemedic user=pipelinemedic password=pipelinemedic host=postgres port=5432"
    # The official Airflow image ships without psycopg2; the DAG needs it
    # to talk to the pipelinemedic Postgres database directly.
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "cGlwZWxpbmVtZWRpYy0x"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  kafka-topic-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.raw --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.validated --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pipeline.dlq --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pipeline.incidents --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pipeline.audit --partitions 1 --replication-factor 1
      "

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipelinemedic
      POSTGRES_PASSWORD: pipelinemedic
      POSTGRES_DB: pipelinemedic
    ports:
      - "5433:5432"  # 5433 on host to avoid colliding with any local Postgres install on 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinemedic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://pipelinemedic:pipelinemedic@postgres:5432/pipelinemedic
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      FLINK_JOBMANAGER_URL: http://flink-jobmanager:8081
      # Set to "false" when running `--profile full` with a real Flink job
      # submitted (see flink-job-submitter), so the Python fallback validator
      # doesn't double-consume orders.raw alongside the real Flink job.
      PIPELINE_MONITOR_STREAM_VALIDATOR_ENABLED: ${PIPELINE_MONITOR_STREAM_VALIDATOR_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./dashboard
      args:
        # Browser-side fetches, so this must be reachable from the host
        # (published backend port), not the internal service DNS name.
        VITE_API_BASE_URL: ${DASHBOARD_API_BASE_URL:-http://localhost:8000}
    ports:
      - "4173:4173"
    depends_on:
      - backend

  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCENARIO: ${SCENARIO:-normal}
      RATE_PER_SEC: ${RATE_PER_SEC:-2}
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully

  # ---- Flink: real jobmanager/taskmanager cluster. See docs/limitations in
  # README for status of the PyFlink job submission in this environment.
  flink-jobmanager:
    image: pipelinemedic-flink
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    profiles: ["full"]

  flink-taskmanager:
    image: pipelinemedic-flink
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    profiles: ["full"]

  flink-job-submitter:
    image: pipelinemedic-flink
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      until curl -sf http://flink-jobmanager:8081/overview; do echo waiting for jobmanager; sleep 3; done &&
      flink run -d -py /opt/flink/jobs/order_validator_job.py -m flink-jobmanager:8081
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      kafka-topic-init:
        condition: service_completed_successfully
    profiles: ["full"]

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true"
    profiles: ["full"]

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    profiles: ["full"]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    profiles: ["full"]

volumes:
  kafka_data:
  pg_data:
  airflow_logs:
